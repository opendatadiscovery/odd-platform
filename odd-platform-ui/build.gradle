plugins {
    id "java"
    id "com.github.node-gradle.node" version "5.0.0"
    id "org.sonarqube" version "3.3"
}

node {
    download = true
    version = "24.13.0"
    pnpmVersion = "9.12.3"
}

tasks.register("buildUI", PnpmTask) {
    // Output is defined in the vite.config.ts. These are for incremental builds only
    inputs.dir("src")
    outputs.dir("${project.buildDir}/ui")

    dependsOn pnpmInstall
    args = ['run', 'build']
}

// The frontend unit suite (vitest), on the same pinned node + pnpm the bundle is built with. `test:ci` runs the
// OpenAPI codegen first because the components import the generated client, which is not checked in. Wired into
// .github/workflows/run-pr-tests.yaml — before 2026-09 nothing in CI ran this suite: run_tests built the API with
// -PbundleUI=false and the Playwright job stopped at the image build, so a green PR said nothing about these tests.
tasks.register("testUI", PnpmTask) {
    dependsOn pnpmInstall
    args = ['run', 'test:ci']
}

jar {
    from buildUI into 'static'
}

clean.doFirst {
    delete "${project.projectDir}/src/generated-sources"
}

sonarqube {
    properties {
        property "sonar.projectKey", "odd-platform_frontend"
        property "sonar.organization", "opendatadiscovery"
        property "sonar.host.url", "https://sonarcloud.io"

        property "sonar.sources", "."
        property "sonar.exclusions", "**/__test?__/**"
        property "sonar.sourceEncoding", "UTF-8"
    }
}