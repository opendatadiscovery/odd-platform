    AssetKind:
      type: string
      description: >-
        The catalog asset kind a favorite entry points at. A Lookup Table is favorited via its
        DATA_ENTITY projection (lookup_tables.data_entity_id), so it is not a distinct kind.
      enum:
        - DATA_ENTITY
        - TERM
        - QUERY_EXAMPLE

    AssetRef:
      type: object
      description: >-
        A polymorphic reference to a catalog asset. The (asset_kind, asset_id) pair is mandatory —
        the asset kinds use independent id sequences, so asset_id alone is ambiguous.
      properties:
        asset_kind:
          $ref: '#/components/schemas/AssetKind'
        asset_id:
          type: integer
          format: int64
      required:
        - asset_kind
        - asset_id

    AssetRefList:
      type: array
      items:
        $ref: '#/components/schemas/AssetRef'

    FavoriteAsset:
      type: object
      description: >-
        A favorited catalog asset. Exactly one of the per-kind references is populated, selected by asset_kind;
        the others are absent. A deleted asset is never returned (visibility is inherited from each kind's query).
      properties:
        asset_kind:
          $ref: '#/components/schemas/AssetKind'
        data_entity:
          $ref: '#/components/schemas/DataEntityRef'
        term:
          $ref: '#/components/schemas/TermRef'
        query_example:
          $ref: '#/components/schemas/QueryExampleRef'
      required:
        - asset_kind

    FavoriteAssetList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteAsset'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page_info

    RecentlyViewedAsset:
      type: object
      description: >-
        A recently-viewed catalog asset (the recency companion to FavoriteAsset). Exactly one of the per-kind
        references is populated, selected by asset_kind; the others are absent. A deleted asset is never
        returned (visibility is inherited from each kind's query). last_viewed_at is when the current user last
        opened it (UTC).
      properties:
        asset_kind:
          $ref: '#/components/schemas/AssetKind'
        data_entity:
          $ref: '#/components/schemas/DataEntityRef'
        term:
          $ref: '#/components/schemas/TermRef'
        query_example:
          $ref: '#/components/schemas/QueryExampleRef'
        last_viewed_at:
          type: string
          format: date-time
      required:
        - asset_kind
        - last_viewed_at

    Asset:
      type: object
      description: >-
        A polymorphic catalog asset in a cross-kind search result (ADR D2). Exactly one of the per-kind
        references is populated, selected by asset_kind; the others are absent. The array order is the
        server-side ranking. A deleted / hidden asset is never returned (visibility is inherited from
        each kind's query).
      properties:
        asset_kind:
          $ref: '#/components/schemas/AssetKind'
        data_entity:
          $ref: '#/components/schemas/DataEntityRef'
        term:
          $ref: '#/components/schemas/TermRef'
        query_example:
          $ref: '#/components/schemas/QueryExampleRef'
      required:
        - asset_kind

    AssetList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        page_info:
          $ref: '#/components/schemas/AssetPageInfo'
      required:
        - items
        - page_info

    AssetPageInfo:
      type: object
      description: >-
        Pagination metadata for the cross-kind asset search (ST-5b). Unlike the shared offset PageInfo, this
        carries an opaque forward-only cursor: the search paginates by keyset seek so deep pages stay
        index-fast and stable under concurrent writes (the relevance sort keeps a bounded offset). total is
        the match count (display only, unaffected by paging depth); hasNext drives the infinite scroll;
        nextCursor is echoed back as the cursor query param to fetch the next page, and is absent on the last
        page. A malformed or foreign cursor fails closed to the first page.
      properties:
        total:
          type: integer
          format: int64
        hasNext:
          type: boolean
        nextCursor:
          type: string
          description: Opaque forward-only pagination token; pass it back as the cursor query param. Absent on the last page.
        scopeTruncated:
          type: boolean
          description: >-
            True when the My-data lineage expansion (ST-8 / #1842) hit a bound, so the result set is a SUBSET
            of the true scope. The client MUST surface this — an impact-analysis result presented as complete
            when it is partial is a false governance claim. Absent or false means the scope was fully resolved.
        scopeTruncationReason:
          type: string
          description: >-
            Why the scope was truncated, present only when scopeTruncated is true. NODE_CAP — the traversal
            reached its node budget; the returned set is a deterministic prefix, so the same request always
            yields the same subset (a shareable URL re-runs identically). TIMEOUT — the traversal exceeded its
            wall-clock circuit breaker and NO scope was applied; this outcome is load-dependent and the client
            must tell the user to reduce depth or narrow the filters rather than present a partial set.
      required:
        - total
        - hasNext

    AssetSearchFormData:
      description: >-
        The cross-kind search request — the shared SearchFormData (query + filters + sort + the My-data scope
        group + the deprecated my_objects) plus an optional asset_kinds filter that narrows to specific kinds
        (empty / absent = all kinds), an optional favorites filter scoped to the caller's own starred
        assets, an optional popularity range (ST-9 / #1843) over the snapshotted view-count band, and an
        optional recently_viewed scope (ST-10 / #1844) over the caller's own viewing history. The My-data,
        favorites, popularity and recently-viewed narrowings are independent axes and compose freely.
      allOf:
        - $ref: '#/components/schemas/SearchFormData'
        - type: object
          properties:
            asset_kinds:
              type: array
              items:
                $ref: '#/components/schemas/AssetKind'
            popularity:
              $ref: '#/components/schemas/PopularityRange'
            recently_viewed:
              $ref: '#/components/schemas/RecentlyViewedScope'
            favorites:
              type: boolean
              description: >-
                Narrows the result set by the caller's own favorites (ST-7 / #1841). `true` returns only
                assets the caller has starred; `false` returns only assets they have not; **absent means no
                favorites narrowing at all** — which is why this is an optional boolean rather than an enum,
                and why it must never be defaulted to `false` by a client. Applies uniformly to every asset
                kind, because a favorite is keyed on the polymorphic (asset_kind, asset_id) pair.
                The identity is taken from the security context only — never from this request — so a caller
                can never read another user's favorites; under `auth.type=DISABLED` there is no principal and
                all callers share one instance-wide bucket.

    RecentlyViewedScope:
      type: object
      description: >-
        The caller's own recently-viewed history as a search scope (ST-10 / #1844, ADR unified-asset-search D3):
        narrows the results to assets THIS caller has opened, optionally within a datetime window over when they
        last opened each one.

        PRESENCE IS THE SWITCH. An empty object `{}` means "every asset in my history" (any time); adding a bound
        narrows further. This is the OPPOSITE of PopularityRange, where an empty object means no narrowing at
        all — the difference is deliberate and is stated in both descriptions so it reads as a decision rather
        than as drift: a popularity range with no bounds expresses nothing, while a recency scope with no bounds
        expresses "assets I have opened", which is exactly what the home page's Recently Viewed panel links to.

        Both bounds are inclusive UTC instants; an absent bound is open. A client sends the instants it means —
        typically the user's local start-of-day and end-of-day converted to UTC — so a shared link reproduces the
        same result set for a recipient in another time zone, who simply sees those instants as their own local
        days.

        Applies to EVERY asset kind (data entities, terms, query examples): the history is keyed on the
        polymorphic (asset_kind, asset_id) pair, and an asset missing from it is genuinely one this caller has
        not opened — unlike a popularity range, where terms and query examples are merely uncounted.

        The identity is taken from the security context only — never from this request — so a caller can only
        ever scope by their own history; under `auth.type=DISABLED` there is no principal and all callers share
        one instance-wide bucket, which the UI labels. A shared or saved search therefore re-resolves to the
        RECIPIENT's history, never the sender's.

        Fail-closed rules: a contradictory window (viewed_after > viewed_before) matches nothing — 200 with an
        empty page, never an error; a saved search that stored one reads BOTH bounds back absent, so it reapplies
        as the search it can still run ("any time") rather than as an empty one; an unparseable instant is
        rejected by the request binding with 400, never a 500.

        The history the scope can see is bounded by the deployment's housekeeping retention settings
        (`housekeeping.ttl.recently_viewed_days` and `recently_viewed_max_per_user`), so a window reaching
        further back than the retention keeps returns only what survives.
      properties:
        viewed_after:
          type: string
          format: date-time
          description: Only assets last opened at or after this instant (UTC, inclusive). Absent = no lower bound.
        viewed_before:
          type: string
          format: date-time
          description: Only assets last opened at or before this instant (UTC, inclusive). Absent = no upper bound.

    PopularityRange:
      type: object
      description: >-
        A closed range over the popularity SCORE of a data entity (ST-9 / #1843, ADR unified-asset-search D5):
        the snapshotted, bucketed view count on the unified search index — score s is the log2 band of the view
        count, so s covers [2^s - 1, 2^(s+1) - 2] views (0 = never viewed, 1 = 1-2 views, 2 = 3-6, 3 = 7-14,
        4 = 15-30, 5 = 31-62, ... 20 = 1,048,575 or more). The snapshot is refreshed every 15 minutes; it is never
        the live view counter. Both bounds are optional and inclusive: an absent bound is open. A request with a
        range (either bound set) narrows to DATA ENTITIES ONLY — terms and query examples have no view count and
        are excluded outright rather than treated as never viewed. Fail-closed rules: each bound is clamped into
        [0, 20] server-side (a stale or hand-edited link degrades instead of 400-ing, the depth precedent); a
        contradictory range (min > max after clamping) matches nothing (200 with an empty page) on a live request,
        while a saved search that stored one reads it back as absent; an empty object with no bounds is the same
        as absent (no range, no narrowing). The per-band counts and the exact view boundaries of every band come
        from POST /api/search/assets/facets/popularity.
      properties:
        min:
          type: integer
          format: int32
          description: The lowest score included (0..20). Absent = no lower bound.
        max:
          type: integer
          format: int32
          description: The highest score included (0..20). Absent = no upper bound.

    PopularityBucket:
      type: object
      description: One popularity band of the distribution — the score, the exact view-count boundaries it covers, and how many data entities of the current (otherwise-filtered) result set sit in it.
      properties:
        score:
          type: integer
          format: int32
          description: The band's popularity score, 0..20 — the value PopularityRange bounds refer to.
        min_views:
          type: integer
          format: int64
          description: The lowest view count in this band (2^score - 1). The label a client should show is built from this boundary, never from a rounded figure.
        max_views:
          type: integer
          format: int64
          description: The highest view count in this band (2^(score+1) - 2). ABSENT on the top band (score 20), which is open above 1,048,575 views — an open end is the field's absence, never a sentinel.
        count:
          type: integer
          format: int64
          description: How many data entities matching every OTHER condition of the request fall in this band.
      required:
        - score
        - min_views
        - count

    PopularityFacet:
      type: object
      description: >-
        The popularity distribution of the current search (ST-9 / #1843): exactly 21 buckets, scores 0..20 in
        order, each with its view boundaries and its count. Counts are taken over the DATA ENTITIES that match
        every other condition of the request — the query, asset_kinds, the entity classes, the six shared
        facets, the My-data scope and the favorites scope — with the request's own popularity range IGNORED (so
        the bars a client renders show what the user can still slide back to). Terms and query examples never
        contribute (they have no view count). A request whose other conditions match no data entity returns 21
        zero counts, never an error.
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/PopularityBucket'
      required:
        - buckets

    RecentlyViewedAssetList:
      type: object
      properties:
        items:
