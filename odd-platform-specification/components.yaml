      properties:
        table_id:
          type: integer
          format: int64
        dataset_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        namespace:
          $ref: '#/components/schemas/Namespace'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/LookupTableField'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - table_id
        - dataset_id
        - table_name
        - namespace
        - fields

    LookupTableField:
      type: object
      properties:
        field_id:
          type: integer
          format: int64
        dataset_field_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        field_type:
          $ref: '#/components/schemas/LookupTableFieldType'
        is_primary_key:
          type: boolean
        is_nullable:
          type: boolean
        is_unique:
          type: boolean
        default_value:
          type: string
      required:
        - field_id
        - dataset_field_id
        - name
        - field_type

    ReferenceDataSearchFormData:
      type: object
      properties:
        query:
          type: string

    ReferenceDataSearchFacetsData:
      type: object
      properties:
        search_id:
          type: string
          format: uuid
        query:
          type: string
        total:
          type: integer
          format: int64
      required:
        - search_id
        - query

    LookupTableRowFormDataList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LookupTableRowFormData'
      required:
        - items

    LookupTableRowFormData:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LookupTableRowColumnFormData'
      required:
        - items

    LookupTableRowColumnFormData:
      type: object
      properties:
        field_id:
          type: integer
          format: int64
        value:
          type: string
      required:
        - field_id

    LookupTableRowList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LookupTableRow'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page_info

    LookupTableRow:
      type: object
      properties:
        row_id:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/LookupTableRowColumnData'
      required:
        - items
        - row_id

    LookupTableRowColumnData:
      type: object
      properties:
        field_id:
          type: integer
          format: int64
        value:
          type: string
      required:
        - field_id
        - value

    DataEntityRelationshipList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataEntityRelationship'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page_info

    DataEntityRelationshipDetailsList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataEntityRelationshipDetails'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page_info

    DataEntityRelationship:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        oddrn:
          type: string
        source_data_entity:
          $ref: '#/components/schemas/DataEntityRef'
        target_data_entity:
          $ref: '#/components/schemas/DataEntityRef'
        data_source:
          $ref: '#/components/schemas/DataSourceSafe'
        type:
          $ref: '#/components/schemas/DataEntityRelationshipType'
      required:
        - id
        - name
        - oddrn
        - source_data_entity
        - target_data_entity
        - data_source
        - type

    DataEntityRelationshipDetails:
      allOf:
        - $ref: '#/components/schemas/DataEntityRelationship'
        - type: object
          properties:
            erd_relationship:
              $ref: '#/components/schemas/ERDRelationshipDetails'
            graph_relationship:
              $ref: '#/components/schemas/GraphRelationshipDetails'

    DataEntityRelationshipType:
      type: string
      enum:
        - ENTITY_RELATIONSHIP
        - GRAPH_RELATIONSHIP

    ERDRelationshipDetails:
      type: object
      properties:
        erd_relationship_id:
          type: integer
          format: int64
          description: >-
            Internal id of the ERD detail record. Not a valid `relationship_id` path
            parameter value - use the relationship's `id` field for that.
        fields_pairs:
          type: array
          items:
            $ref: '#/components/schemas/ERDRelationshipPairs'
        is_identifying:
          type: boolean
        cardinality:
          type: string
      required:
        - fields_pairs

    ERDRelationshipPairs:
      type: object
      properties:
        source_dataset_field_id:
          type: integer
          format: int64
        source_dataset_field_oddrn:
          type: string
        target_dataset_field_id:
          type: integer
          format: int64
        target_dataset_field_oddrn:
          type: string
      required:
        - source_dataset_field_oddrn
        - target_dataset_field_oddrn

    GraphRelationshipDetails:
      type: object
      properties:
        graph_relationship_id:
          type: integer
          format: int64
          description: >-
            Internal id of the graph detail record. Not a valid `relationship_id` path
            parameter value - use the relationship's `id` field for that.
        is_directed:
          type: boolean
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/GraphRelationshipAttributes'

    GraphRelationshipAttributes:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required:
        - field
        - value

    RelationshipsType:
      type: string
      enum:
        - ERD
        - GRAPH
        - ALL

    GenAIRequest:
      type: object
      properties:
        body:
          type: string

    GenAIResponse:
      type: object
      properties:
        body:
          type: string

  parameters:
    PageParam:
      name: page
      in: query
      description: Page
      required: true
      schema:
        type: integer
        format: int32

    SizeParam:
      name: size
      in: query
      description: Size
      required: true
      schema:
        type: integer
        format: int32

    AssetSearchCursorParam:
      name: cursor
      in: query
      description: >-
        Opaque forward-only pagination cursor (ST-5b). Absent / empty = the first page; otherwise pass back
        the previous page's page_info.nextCursor. The cursor is scoped to the request's sort — changing the
        query, filters, or sort resets to the first page — and a malformed or foreign cursor fails closed to
        the first page (never an error).
      required: false
      schema:
        type: string

    SearchParam:
      name: query
      in: query
      description: Search text
      required: false
      schema:
        type: string

    IdsParam:
      name: ids
      in: query
      description: Entity ids
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64

    DataEntityIdParam:
      name: data_entity_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    DataQATestIdParam:
      name: dataqa_test_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    DatasetFieldIdParam:
      name: dataset_field_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    DataEntityGroupIdParam:
      name: data_entity_group_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    DataEntityMetadataFieldIdParam:
      name: metadata_field_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    OwnershipIdParam:
      name: ownership_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    AlertIdParam:
      name: alert_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    EnumValueIdParam:
      name: enum_value_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    TermIdParam:
      name: term_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    LinkedTermIdParam:
      name: linked_term_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    PolicyIdParam:
      name: policy_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    PermissionResourceTypeParam:
      name: permission_resource_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PermissionResourceType'

    DataSourceIdParam:
      name: data_source_id
      in: path
      requited: true
      schema:
        type: integer
        format: int64

    QueryExampleIdParam:
      name: example_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    LookupTableIdParam:
      name: lookup_table_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    LookupColumnIdParam:
      name: column_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    LookupRowIdParam:
      name: row_id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    RelationshipIdParam:
      name: relationship_id
      in: path
      description: >-
        Id of the relationship-class data entity, i.e. the `id` field of
        `DataEntityRelationship` / `DataEntityRelationshipDetails` items. The
        `erd_relationship_id` and `graph_relationship_id` fields exposed in the details
        payload are internal detail-record ids and are NOT valid values for this parameter.
      required: true
      schema:
        type: integer
        format: int64

    RelationshipTypeParam:
      name: type
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/RelationshipsType'

  responses:
    Deleted:
      description: The resource has been successfully deleted

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
