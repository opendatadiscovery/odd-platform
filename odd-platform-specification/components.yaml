    SearchFormData:
      type: object
      properties:
        query:
          type: string
          description: >-
            The free-text query. Bare words match as PREFIXES and are combined with AND, so `cust order`
            matches an asset named "Customers Orders". Three operators refine that: `"a quoted phrase"`
            matches the words adjacently and exactly; a `-word` (or `-"a phrase"`) EXCLUDES matches, exactly;
            and the bare word `or` makes alternatives, binding more loosely than AND (`a or b -c` is
            `a OR (b AND NOT c)`). Operators narrow a query -- they never turn off prefix matching on the
            bare words around them. A query with no positive term (`-test` alone) returns no results.
            Metacharacters are not searchable literals: they are treated as word separators, and a query made
            only of them returns an empty result rather than an error.
        my_objects:
          type: boolean
          deprecated: true
          description: >-
            DEPRECATED (ST-8 / #1842) — superseded by my_data. Kept working for existing clients, saved
            searches and bookmarked URLs: when my_data is absent, `my_objects: true` is read as
            `my_data: ["MY_OBJECTS"]`. When my_data is present it wins and this field is ignored.
        my_data:
          type: array
          items:
            type: string
          description: >-
            The My-data scope group (ST-8 / #1842, ADR unified-asset-search D4). Tokens, case-insensitive:
            MY_OBJECTS (assets the caller owns — data entities via `ownership`, terms via `term_ownership`;
            query examples have no ownership model and are excluded), UPSTREAM (the data entities the owned
            set depends on) and DOWNSTREAM (the data entities that depend on the owned set). Multiple tokens
            are UNIONed. Empty or absent means no scope narrowing. Deliberately a plain string array rather
            than a strict enum, for the same reason `sort` is a plain string: an unrecognised token degrades
            gracefully (it is dropped) instead of failing the request, so a hand-edited or stale shareable
            URL can never 400. The scope resolves server-side from the authenticated principal only — no
            owner identity is ever accepted from the request. With no resolvable owner the result is empty,
            never unscoped. HONOURED BY the cross-kind `POST /api/search/assets`; the legacy `/api/search`
            session reads only `my_objects` and ignores this field.
        upstream_depth:
          type: integer
          format: int32
          description: >-
            How many lineage hops upstream the UPSTREAM scope walks from the owned set. Default 1, hard
            ceiling 3. Applies only when UPSTREAM is selected. Deliberately carries no `minimum`/`maximum`:
            an out-of-range INTEGER (0, -7, 99) is CLAMPED into [1,3] server-side rather than rejected, so a
            stale or hand-edited shareable URL degrades instead of 400-ing (the `sort` precedent). A value of
            the wrong JSON TYPE ("abc") is still rejected by the deserialiser like any typed field — the UI
            cannot produce one, because the URL parser drops a non-numeric depth before the request is built.
        downstream_depth:
          type: integer
          format: int32
          description: >-
            How many lineage hops downstream the DOWNSTREAM scope walks from the owned set. Default 1, hard
            ceiling 3, independently settable from upstream_depth (ADR D4). Same clamp-in-range rule, and the
            same wrong-JSON-type caveat, as upstream_depth.
        sort:
          type: string
          description: >-
            The named canonical ordering for the result set — one of RELEVANCE, STATUS_PRIORITY,
            UPDATED_AT, NAME, POPULARITY, LAST_VIEWED (case-insensitive). Absent or unrecognised values fall
            back to a per-context default (relevance for an active text query, status priority for empty
            browse). Deliberately a plain string rather than a strict enum so an unknown value
            degrades gracefully to the default instead of failing the request. POPULARITY (ST-9 /
            #1843) orders most-viewed first by the snapshotted popularity score — the 15-minute
            bucketed view-count band on the unified index, never the live counter — with terms and
            query examples (no view count) last; it is HONOURED BY the cross-kind POST /api/search/assets
            only. On the legacy /api/search session it resolves to the per-context default, exactly as an
            unknown token does — that path orders data_entity rows, which carry no popularity column.
            LAST_VIEWED (ST-10 / #1844) orders most-recently-opened first, by when THIS caller last opened
            each asset. It is meaningful only while a recently_viewed scope is present, because that scope is
            what brings the caller's history into the query: WITHOUT it the token resolves to the per-context
            default, exactly like an unknown one, on the cross-kind path and on the legacy session alike.
            WITH the scope present it also becomes the BROWSE default — an empty query resolves to
            LAST_VIEWED instead of STATUS_PRIORITY, so "what I opened" reads as a history — while an active
            text query still resolves to RELEVANCE.
        filters:
          type: object
          properties:
            types:
              type: array
              items:
                $ref: '#/components/schemas/SearchFilterState'
            entity_classes:
              type: array
              items:
                $ref: '#/components/schemas/SearchFilterState'
            tags:
              type: array
              items:
                $ref: '#/components/schemas/SearchFilterState'
            namespaces:
              type: array
              items:
                $ref: '#/components/schemas/SearchFilterState'
            owners:
              type: array
              items:
                $ref: '#/components/schemas/SearchFilterState'
            datasources:
              type: array
              items:
                $ref: '#/components/schemas/SearchFilterState'
            groups:
              type: array
              items:
                $ref: '#/components/schemas/SearchFilterState'
            statuses:
              type: array
              items:
                $ref: '#/components/schemas/SearchFilterState'
      required:
        - filters

    SavedSearch:
      type: object
      description: >-
        A named, per-user saved search (ST-3 / ADR D11). `spec` is the parametrised search state — the same
        AssetSearchFormData the unified search sends and the URL encodes (query + filters + sort + the My-data
        scope + asset_kinds + favorites) — so one canonical spec drives both the shareable URL and the saved
        row, and every URL-only dimension is saveable (#1878: it was SearchFormData, which silently dropped
        asset_kinds and favorites; the same widening is what lets popularity and recently_viewed round-trip).
        Fields a row was saved without read back as null / absent, never as a narrowing. A stored
        recently_viewed whose window is contradictory reads back with both bounds absent — the scope survives
        as "any time", the search it can still run. Private to its owner; sharing is the parametrised URL, not a grant.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        spec:
          $ref: '#/components/schemas/AssetSearchFormData'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - spec
        - created_at
        - updated_at

    SavedSearchList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedSearch'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page_info

    SavedSearchFormData:
      type: object
      description: >-
        Create/update payload for a saved search — a name plus the search spec to persist. The spec is the
        full AssetSearchFormData (#1878), so a client saves exactly the request it runs; an absent favorites /
        asset_kinds stays absent (no narrowing), never defaults.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        spec:
          $ref: '#/components/schemas/AssetSearchFormData'
      required:
        - name
        - spec

